# For local production (not for vps deployment)
services:
  # Real-Time WebSocket & REST Backend Server
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: vizi-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - "apps/server/.env.prod"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://192.168.1.13:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shared

  # Next.js Collaborative Web Client
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: vizi-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - "apps/web/.env.production"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://192.168.1.13:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - shared

networks:
  shared:
    name: infra-network
    driver: bridge
